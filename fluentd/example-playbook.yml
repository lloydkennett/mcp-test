---
# Example playbook using the fluent_package role

- name: Install fluent-package on RedHat systems
  hosts: all
  become: yes
  gather_facts: yes

  tasks:
    - name: Display system information
      debug:
        msg: >
          Installing fluent-package on {{ ansible_distribution }}
          {{ ansible_distribution_version }} ({{ ansible_architecture }})

    - name: Include fluent_package role
      include_role:
        name: fluent_package

    - name: Verify fluent-package installation
      command: fluent-package --version
      changed_when: false
      register: fluent_version

    - name: Display fluent-package version
      debug:
        msg: "fluent-package version: {{ fluent_version.stdout }}"

